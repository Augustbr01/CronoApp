<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="CronoApp">
  <!--
    O ícone do CronoApp: três faders de uma mesa de som, na cor de destaque do
    painel (#e8b64c) sobre o fundo escuro dele (#0f1013).

    Motivo escolhido porque é o que o app é — não uma nota musical genérica. O
    fader do meio está no alto e aceso: é o louvor no ar, com os outros dois
    abaixo. Legível a 16 px, que é onde ele passa a maior parte da vida.
  -->
  <rect width="512" height="512" rx="112" fill="#0f1013" />

  <!-- Trilhos -->
  <g stroke="#2a2e36" stroke-width="26" stroke-linecap="round">
    <line x1="146" y1="120" x2="146" y2="392" />
    <line x1="256" y1="120" x2="256" y2="392" />
    <line x1="366" y1="120" x2="366" y2="392" />
  </g>

  <!-- Percurso já percorrido por cada fader, aceso -->
  <g stroke="#e8b64c" stroke-width="26" stroke-linecap="round">
    <line x1="146" y1="286" x2="146" y2="392" />
    <line x1="256" y1="176" x2="256" y2="392" />
    <line x1="366" y1="330" x2="366" y2="392" />
  </g>

  <!-- Os cursores -->
  <g fill="#f6f7f9">
    <rect x="112" y="266" width="68" height="40" rx="12" />
    <rect x="222" y="156" width="68" height="40" rx="12" />
    <rect x="332" y="310" width="68" height="40" rx="12" />
  </g>
</svg>
